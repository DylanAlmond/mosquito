# Desktop UI harness sweep (issues #7, #8, #23): one pass over the real
# dev build against the fixtures seeded via `tauri-pilot ipc
# harness_seed` (deterministic temp tree: two loose files + the
# `Photographs` folder) — see `harness/desktop/run.mjs`.
#
# The seed flows through the production import-run path (ADR-0007): the
# loose files register immediately; `Photographs` is counted by a
# background import run and commits a root record — with no rows here,
# because the desktop list browses root records only from #24 onward.
# The sweep therefore exercises the loose rows (rendering, selection,
# bulk removal) and the empty-list return, and closes with the node
# selection pass (issue #29): the `travel` subfolder row carries its own
# node checkbox, its covered member goes inert, and one remove_node
# action sweeps exactly that subtree while the record itself survives.
# The folder import itself is validated by the count walk in the core
# suite plus the progress board in the SharePanel unit tests.
#
# Targets are CSS attribute selectors, not snapshot refs: refs reset on
# every snapshot and scenarios have no snapshot step. Screenshots land
# in `test-results/desktop-harness/`; failure shots go to the
# `--screenshots-dir` the driver passes.

[[step]]
name = "the shared-files panel appears once the fixture seed drained"
action = "wait"
selector = '[aria-label="Show shared files"]'
timeout_ms = 120000

[[step]]
name = "record the initial sharing panel"
action = "screenshot"
path = "test-results/desktop-harness/desktop-start.png"

[[step]]
name = "expand the files list"
action = "click"
target = '[aria-label="Show shared files"]'

[[step]]
name = "the file table renders"
action = "wait"
selector = ".file-table"
timeout_ms = 30000

[[step]]
name = "settle the list layout"
action = "watch"
selector = ".file-rows"
stable = 250

[[step]]
name = "the fixture folder's import run has settled"
action = "wait"
selector = '[aria-label="Import progress"]'
gone = true
timeout_ms = 60000

[[step]]
name = "the loose files got their row checkboxes"
action = "assert-exists"
target = '[aria-label="Select beach-notes.txt"]'

[[step]]
name = "the second loose file is listed"
action = "assert-exists"
target = '[aria-label="Select release-plan.md"]'

[[step]]
name = "the imported folder contributes no rows yet — root records browse from #24"
action = "assert-count"
selector = ".file-row"
expected = 2

[[step]]
name = "select the first loose file"
action = "click"
target = '[aria-label="Select beach-notes.txt"]'

[[step]]
name = "the selection highlights the row"
action = "assert-exists"
target = '[aria-label="Deselect beach-notes.txt"]'

[[step]]
name = "select all shared files"
action = "click"
target = '[aria-label="Select all shared files"]'

[[step]]
name = "every loose row highlights"
action = "assert-count"
selector = ".file-row.is-selected"
expected = 2

[[step]]
name = "capture the select-all state"
action = "screenshot"
path = "test-results/desktop-harness/selections.png"
selector = ".file-table"

[[step]]
name = "deselect the record's whole group — the loose sweep must leave it"
action = "click"
target = '[aria-label="Select or deselect all files in Photographs"]'

[[step]]
name = "bulk-remove the loose selection"
action = "click"
target = '[aria-label="Delete selected files"]'

[[step]]
name = "the loose rows go; the table stays for the record's group row"
action = "assert-exists"
target = '[aria-label="Expand Photographs"]'

[[step]]
name = "the removal's re-read settles (busy lifts)"
action = "wait"
selector = '[aria-busy="true"]'
gone = true
timeout_ms = 30000

[[step]]
name = "the imported folder still counts as shared, so the card stays up"
action = "assert-exists"
target = ".dropzone--active"

# -- the node selection pass (issue #29): the record survived the loose
# sweep above, so its lazily-known rows come through their own expansion.

[[step]]
name = "expand the record"
action = "click"
target = '[aria-label="Expand Photographs"]'

[[step]]
name = "the travel subfolder row appears with its own node checkbox"
action = "wait"
selector = '[aria-label="Select or deselect all files in travel"]'
timeout_ms = 30000

[[step]]
name = "select the travel node"
action = "click"
target = '[aria-label="Select or deselect all files in travel"]'

[[step]]
name = "expand the selected node: its covered member ticks inertly"
action = "click"
target = '[aria-label="Expand travel"]'

[[step]]
name = "the covered member shows the node's tick and stands down"
action = "wait"
selector = '[aria-label="Select beach.jpg"][disabled]'
timeout_ms = 30000

[[step]]
name = "remove the selected subtree: one remove_node action"
action = "click"
target = '[aria-label="Delete selected files"]'

[[step]]
name = "node removal takes only the subtree: the record's group stays"
action = "assert-exists"
target = '[aria-label="Select or deselect all files in Photographs"]'

[[step]]
name = "the record's live count reflects the removal: sunrise.jpg remains"
action = "assert-exists"
target = '[aria-label="Select sunrise.jpg"]'

[[step]]
name = "capture the post-node-removal state"
action = "screenshot"
path = "test-results/desktop-harness/after-node-removal.png"
selector = ".file-table"

[[step]]
name = "final state"
action = "screenshot"
path = "test-results/desktop-harness/after-removal.png"
