# Desktop UI harness sweep (issues #7, #8, #23): one pass over the real
# dev build against the fixtures seeded via `tauri-pilot ipc
# harness_seed` (deterministic temp tree: two loose files + the
# `Photographs` folder) — see `harness/desktop/run.mjs`.
#
# The seed flows through the production import-run path (ADR-0007): the
# loose files register immediately; `Photographs` is counted by a
# background import run and commits a root record — with no rows here,
# because the desktop list browses root records only from #24 onward.
# The sweep therefore exercises the loose rows (rendering, selection,
# bulk removal) and the empty-list return; the folder import itself is
# validated by the count walk in the core suite plus the progress board
# in the SharePanel unit tests.
#
# Targets are CSS attribute selectors, not snapshot refs: refs reset on
# every snapshot and scenarios have no snapshot step. Screenshots land
# in `test-results/desktop-harness/`; failure shots go to the
# `--screenshots-dir` the driver passes.

[[step]]
name = "the shared-files panel appears once the fixture seed drained"
action = "wait"
selector = '[aria-label="Show shared files"]'
timeout_ms = 120000

[[step]]
name = "record the initial sharing panel"
action = "screenshot"
path = "test-results/desktop-harness/desktop-start.png"

[[step]]
name = "expand the files list"
action = "click"
target = '[aria-label="Show shared files"]'

[[step]]
name = "the file table renders"
action = "wait"
selector = ".file-table"
timeout_ms = 30000

[[step]]
name = "settle the list layout"
action = "watch"
selector = ".file-rows"
stable = 250

[[step]]
name = "the fixture folder's import run has settled"
action = "wait"
selector = '[aria-label="Import progress"]'
gone = true
timeout_ms = 60000

[[step]]
name = "the loose files got their row checkboxes"
action = "assert-exists"
target = '[aria-label="Select beach-notes.txt"]'

[[step]]
name = "the second loose file is listed"
action = "assert-exists"
target = '[aria-label="Select release-plan.md"]'

[[step]]
name = "the imported folder contributes no rows yet — root records browse from #24"
action = "assert-count"
selector = ".file-row"
expected = 2

[[step]]
name = "select the first loose file"
action = "click"
target = '[aria-label="Select beach-notes.txt"]'

[[step]]
name = "the selection highlights the row"
action = "assert-exists"
target = '[aria-label="Deselect beach-notes.txt"]'

[[step]]
name = "select all shared files"
action = "click"
target = '[aria-label="Select all shared files"]'

[[step]]
name = "every loose row highlights"
action = "assert-count"
selector = ".file-row.is-selected"
expected = 2

[[step]]
name = "capture the select-all state"
action = "screenshot"
path = "test-results/desktop-harness/selections.png"
selector = ".file-table"

[[step]]
name = "bulk-remove the selection"
action = "click"
target = '[aria-label="Delete selected files"]'

[[step]]
name = "the empty list unmounts once the files are gone"
action = "wait"
selector = ".file-table"
gone = true
timeout_ms = 30000

[[step]]
name = "the imported folder still counts as shared, so the card stays up"
action = "assert-exists"
target = ".dropzone--active"

[[step]]
name = "final state"
action = "screenshot"
path = "test-results/desktop-harness/after-removal.png"
