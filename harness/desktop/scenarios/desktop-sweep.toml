# Desktop UI harness sweep (issues #7 and #8): one pass over the real
# dev build against the fixtures seeded via `tauri-pilot ipc
# harness_seed` (deterministic temp tree: two loose files + the
# `Photographs` folder with a direct member and a nested one) — see
# `harness/desktop/run.mjs`.
#
# Drives the folder tree (expand/collapse via chevrons, default states,
# subtree selection reaching folded members), selection, and bulk
# removal. Targets are CSS attribute selectors, not snapshot refs: refs
# reset on every snapshot and scenarios have no snapshot step.
# Screenshots land in `test-results/desktop-harness/`; failure shots go
# to the `--screenshots-dir` the driver passes.

[[step]]
name = "the shared-files panel appears once the fixture seed drained"
action = "wait"
selector = '[aria-label="Show shared files"]'
timeout_ms = 120000

[[step]]
name = "record the initial sharing panel"
action = "screenshot"
path = "test-results/desktop-harness/desktop-start.png"

[[step]]
name = "expand the files list"
action = "click"
target = '[aria-label="Show shared files"]'

[[step]]
name = "the file table renders"
action = "wait"
selector = ".file-table"
timeout_ms = 30000

[[step]]
name = "settle the list layout"
action = "watch"
selector = ".file-rows"
stable = 250

[[step]]
name = "the Photographs folder row is expandable and starts expanded"
action = "assert-exists"
target = '[aria-label="Collapse Photographs"]'

[[step]]
name = "the nested travel subfolder starts collapsed"
action = "assert-exists"
target = '[aria-label="Expand travel"]'

[[step]]
name = "loose files got their row checkboxes"
action = "assert-exists"
target = '[aria-label="Select beach-notes.txt"]'

[[step]]
name = "the second loose file is listed"
action = "assert-exists"
target = '[aria-label="Select release-plan.md"]'

[[step]]
name = "the direct folder member keeps its row"
action = "assert-exists"
target = '[aria-label="Select sunrise.jpg"]'

[[step]]
name = "two loose files plus the direct member are listed — the nested member stays folded"
action = "assert-count"
selector = ".file-row"
expected = 3

[[step]]
name = "expand the nested subfolder"
action = "click"
target = '[aria-label="Expand travel"]'

[[step]]
name = "the nested member appears under its subfolder"
action = "assert-count"
selector = ".file-row"
expected = 4

[[step]]
name = "the folded member joins the list"
action = "assert-exists"
target = '[aria-label="Select beach.jpg"]'

[[step]]
name = "capture the expanded tree"
action = "screenshot"
path = "test-results/desktop-harness/folder-tree.png"
selector = ".file-table"

[[step]]
name = "fold the nested subfolder back"
action = "click"
target = '[aria-label="Collapse travel"]'

[[step]]
name = "the collapsed content is gone while the tree keeps its shape"
action = "assert-count"
selector = ".file-row"
expected = 3

[[step]]
name = "toggling the folder selects its whole subtree"
action = "click"
target = '[aria-label="Select or deselect all files in Photographs"]'

[[step]]
name = "the visible member highlights"
action = "assert-exists"
target = '[aria-label="Deselect sunrise.jpg"]'

[[step]]
name = "deselect the visible member"
action = "click"
target = '[aria-label="Deselect sunrise.jpg"]'

[[step]]
name = "the folded member still counts: the folder reads partial select"
action = "assert-exists"
target = '[aria-label="Select or deselect all files in Photographs"][aria-checked="mixed"]'

[[step]]
name = "capture the subtree-selection state"
action = "screenshot"
path = "test-results/desktop-harness/subtree-selection.png"
selector = ".file-table"

[[step]]
name = "reselect the whole subtree"
action = "click"
target = '[aria-label="Select or deselect all files in Photographs"]'

[[step]]
name = "select all shared files"
action = "click"
target = '[aria-label="Select all shared files"]'

[[step]]
name = "the visible rows highlight (the folded member is selected too)"
action = "assert-count"
selector = ".file-row.is-selected"
expected = 3

[[step]]
name = "capture the select-all state"
action = "screenshot"
path = "test-results/desktop-harness/selections.png"
selector = ".file-table"

[[step]]
name = "bulk-remove the selection"
action = "click"
target = '[aria-label="Delete selected files"]'

[[step]]
name = "the empty list unmounts once nothing is shared"
action = "wait"
selector = ".file-table"
gone = true
timeout_ms = 30000

[[step]]
name = "the dropzone is back"
action = "assert-text"
target = ".drop-title"
expected = "Click or Drop files or folders here"

[[step]]
name = "final state"
action = "screenshot"
path = "test-results/desktop-harness/after-bulk-removal.png"
