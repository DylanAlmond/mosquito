<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <title>Mosquito - {{DEVICE_NAME}}</title>
    <style>
      @font-face {
        font-family: 'DynaPuff';
        src: url('/assets/dynapuff-400.woff2') format('woff2');
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: 'DynaPuff';
        src: url('/assets/dynapuff-600.woff2') format('woff2');
        font-style: normal;
        font-weight: 600;
        font-display: swap;
      }
      :root {
        color-scheme: light;
        font-family: 'DynaPuff', cursive;
        color: #000;
        background: #fff;
        font-synthesis: none;
        --ink: #000;
        --surface: #fff;
        --muted: #777;
        --radius: 0.5rem;
        /* Folder-tree shading token, mirroring the desktop app's
           stylesheet token (light scheme only, per ADR-0002). */
        --folder-shade: #f1f1f1;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
      body {
        height: 100dvh;
        margin: 0;
        padding: 0 1.25rem;
        background: #fff;
        color: #000;
        font-size: 1rem;
        overflow: hidden;
      }
      button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        color: inherit;
        font: inherit;
        transition: all 0.16s ease-out;
        border: none;
        background: transparent;
      }
      button:not(:disabled) {
        cursor: pointer;
      }
      button:hover {
        opacity: 0.5;
      }
      button svg {
        display: block;
        width: 1.5rem;
        height: 1.5rem;
      }
      .page {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        max-width: 25rem;
        margin: 0 auto;
      }
      .page-header {
        display: flex;
        flex: 0 0 4rem;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 400;
        line-height: 1;
      }
      .listing {
        overflow: hidden;
        border: 2px solid #000;
        border-radius: 0.5rem;
        background: #fff;
      }
      .file-count {
        display: flex;
        align-items: center;
        /* Files match the folder row height now (ADR-0004 revision):
           the 38px strip is the shared row height, header included. */
        min-height: 2.375rem;
        margin: 0;
        padding: 0 0.875rem;
        border-bottom: 2px solid #000;
        font-size: 0.875rem;
        font-weight: 600;
      }
      /* Grid rows: checkbox, content, trailing control — the desktop
         list's grid with a download button where the app has delete. */
      .files-header {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr) 32px;
        align-items: center;
        column-gap: 4px;
        min-height: 2.375rem;
        padding: 0 0.875rem;
        border-bottom: 2px solid #000;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .files-header .file-count {
        display: block;
        min-height: 0;
        padding: 0;
        border-bottom: none;
      }
      .file-count {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The download button: icon-only where the app has its action
         button, hidden (invisible, inert) until something is selected. */
      .download-selected {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2rem;
        height: 2rem;
        padding: 0;
        color: inherit;
        justify-self: end;
        visibility: hidden;
      }
      .download-selected.is-visible {
        visibility: visible;
      }
      .download-selected:hover,
      .download-selected:focus-visible {
        opacity: 0.5;
      }
      .download-selected svg {
        display: block;
        width: 1.5rem;
        height: 1.5rem;
      }
      /* Desktop list behavior: the entire row inverts, checkbox icon
         included (the icons stroke with currentColor). */
      .file-row:hover,
      .file-row.is-selected {
        background: #000;
        color: #fff;
      }
      .file-list {
        margin: 0;
        height: 100%;
        padding: 0;
        overflow-y: auto;
        list-style: none;
        overscroll-behavior: contain;
        scrollbar-color: #000 transparent;
        scrollbar-width: thin;
      }
      .file-list::-webkit-scrollbar {
        width: 6px;
      }
      .file-list::-webkit-scrollbar-thumb {
        border-radius: 9999px;
        background: #000;
      }
      /* Rows and group headers are flat siblings; every row but the
         first gets a top border, no matter what kind of row precedes
         it — the desktop list's exact rule. */
      .file-list > li {
        border-top: 1px solid #000;
      }
      .file-list > li:first-child {
        border-top: none;
      }
      /* Member rows keep the header's grid — checkbox first, name and
         size filling the rest; the name text is what the depth indent
         moves, the columns never wander. */
      .file-row {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        align-items: center;
        column-gap: 4px;
        padding: 0 0.875rem;
      }
      .file-row a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        /* Files match the folder row height now (ADR-0004 revision):
           the 38px strip is the shared row height, header included. */
        min-height: 2.375rem;
        color: inherit;
        text-decoration: none;
        /* One font size for all rows (ADR-0004) — folder rows already
           carry it. */
        font-size: 0.875rem;
        transition:
          background-color 140ms ease,
          color 140ms ease;
      }
      .file-row a:focus-visible {
        outline: 2px solid #777;
        outline-offset: -4px;
      }
      .file-row span {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .file-row small {
        flex: 0 0 auto;
        font-size: 0.75rem;
      }
      /* Expandable folder rows (ADR-0002): the hierarchy is carried by
         the alternating shade plus the 16px-per-depth indent — the
         name text indents and the chevron travels with it (ADR-0004).
         The row itself is never a toggle: only its chevron is. */
      .folder-row {
        display: grid;
        grid-template-columns: 32px 32px minmax(0, 1fr) auto;
        align-items: center;
        column-gap: 4px;
        min-height: 38px;
        padding: 0 0.875rem;
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1;
      }
      /* Rows carry `--depth` (server-rendered, mirroring the app's row
         tokens): name text indents 16px per depth; the folder chevron
         moves with it. Member rows catch up the chevron slot (36px:
         column + gap) on top of their own depth, so everything inside
         a folder sits exactly one level right of the folder's own
         name; loose rows carry no depth attributes and stay flush. */
      .folder-row .folder-name {
        padding-left: calc(16px * var(--depth, 0));
      }
      .folder-chevron {
        margin-left: calc(16px * var(--depth, 0));
      }
      .file-row[data-depth] a > span {
        padding-left: calc(16px * var(--depth, 0) + 36px);
      }
      [data-shade="1"] {
        background: var(--folder-shade);
      }
      .folder-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Folder rows all carry their node checkbox (issue #27): root
         records and lazily-known subfolders alike — selection resolves
         through the node (ADR-0006) and checking one never
         materializes anything. Only the failure marker keeps the
         spacer: a count row is never a selection target. */
      .checkbox-spacer {
        display: block;
      }
      /* The root row's import-time total: display only — showing it
         materializes nothing (issue #24). */
      .folder-count {
        justify-self: end;
        min-width: 0;
        padding-left: 8px;
        opacity: 0.6;
        font-size: 0.6875rem;
        font-weight: 400;
        white-space: nowrap;
      }
      /* One node's inline materialization-failure marker (ADR-0005): a
         count only, sitting inline with the readable rows that did
         render — see the desktop list's marker, minus its tooltip: no
         absolute paths ever reach receiver markup. */
      .materialize-marker {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        align-items: center;
        column-gap: 4px;
        min-height: 2.375rem;
        padding: 0 0.875rem;
        font-size: 0.8125rem;
        line-height: 1.2;
      }
      .marker-text {
        margin: 0;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 0.65;
        font-style: italic;
        padding-left: calc(16px * var(--depth, 0) + 36px);
      }
      .folder-chevron svg {
        display: block;
        width: 1.5rem;
        height: 1.5rem;
        transition: transform 140ms ease;
      }
      .folder-chevron.is-collapsed svg {
        transform: rotate(180deg);
      }
      @media (prefers-reduced-motion: reduce) {
        .folder-chevron svg {
          transition: none;
        }
      }
      .empty-state {
        margin: 0;
        padding: 1rem 0.875rem;
      }
      .page-footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35rem 0.75rem;
        margin-top: auto;
        padding: 1.5rem 0 1.5rem;
        color: #777;
        font-size: 0.75rem;
        text-align: center;
      }
      .page-footer a {
        color: inherit;
      }
      .page-footer a:hover,
      .page-footer a:focus-visible {
        color: #000;
      }
      @media (prefers-reduced-motion: reduce) {
        .file-row a,
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="page-header"><h1>Mosquito</h1></header>
      <section class="listing" aria-label="Shared files">
        {{LIST_HEADER}}
        {{FILE_CONTENT}}
      </section>
      <footer class="page-footer">
        <span>Shared from {{DEVICE_NAME}}</span>
        <a href="https://github.com/DylanAlmond/mosquito" target="_blank" rel="noopener">GitHub</a>
      </footer>
    </main>
    <script>
      // Progressive enhancement only: with JavaScript off, the
      // checkboxes never appear and the per-file links stay the only
      // (and fully working) way to download; the page renders the top
      // of the listing — loose files plus one row per root record,
      // open only under the five-children budget the server stamps
      // (never re-derived here). The script fetches each expanded
      // node's page from its fragment route and swaps the
      // server-rendered rows into place, so every visible row is
      // derived on the server — same code path as the initial render
      // and the desktop feed (ADR-0006). No tree mirror lives in the
      // markup.
      (function () {
        var list = document.querySelector('.file-list');
        var selectAll = document.getElementById('select-all');
        var downloadButton = document.getElementById('download-selected');
        if (!list || !selectAll || !downloadButton) return;

        // How close to the scroller's end a fetch-ahead begins — the
        // desktop paged feed's threshold (FileList.vue).
        var FETCH_AHEAD_PX = 120;

        // Selection by registered file id plus node addresses
        // (root record id + relative sub path, issue #27): file
        // checkboxes target materialized rows; folder checkboxes
        // select the node itself — never member file ids — and
        // checking never materializes anything. Folder selections are
        // semantic node addresses, so they survive their row
        // collapsing away until unchecked.
        var selected = {};
        var selectedNodes = {};

        // Expansion state and per-node page state, keyed by the folder
        // key the server stamps on every folder row and fragment (the
        // disambiguated root key plus the sub path). Like the desktop,
        // none of this survives a reload — the server-stamped defaults
        // are always the starting point.
        var expanded = {};
        var pages = {};

        // The desktop group rule's tri-state (FileList.vue): true,
        // false, or 'mixed' — mixed lives in the aria state exactly
        // like the desktop root checkboxes; visually only checked
        // swaps to the checked icon.
        function setBox(state, checkbox) {
          var on = state === true || state === 'checked';
          var mixed = state === 'mixed';
          checkbox.setAttribute(
            'aria-checked',
            mixed ? 'mixed' : on ? 'true' : 'false'
          );
          var checked = checkbox.querySelector('.icon-checked');
          var unchecked = checkbox.querySelector('.icon-unchecked');
          if (checked) checked.style.display = on ? '' : 'none';
          if (unchecked) unchecked.style.display = on ? 'none' : '';
          var li = checkbox.closest('.file-row');
          if (li) li.classList.toggle('is-selected', on);
        }

        // A folder row's own address: the root record id plus the
        // relative sub path — the semantic form the payload carries.
        function nodeAddress(row) {
          return row.dataset.nodeRoot + ':' + row.dataset.nodeSub;
        }

        // One folder checkbox's state (the desktop group rule, carried
        // to subfolders, issue #27): checked when the node itself is
        // selected, mixed when some rendered member participates — a
        // picked file row, or a picked subfolder within — unchecked
        // otherwise. Member picks and node picks never turn each other
        // on; the state only ever mirrors the selection.
        function folderState(row) {
          if (selectedNodes[nodeAddress(row)]) return 'checked';
          var depth = Number(row.dataset.depth);
          var member = row.nextElementSibling;
          while (
            member &&
            member.dataset.depth !== undefined &&
            Number(member.dataset.depth) > depth
          ) {
            if (member.classList.contains('file-row')) {
              var box = member.querySelector('[data-select]');
              if (box && selected[box.dataset.select] === true) return 'mixed';
            } else if (
              Number(member.dataset.depth) === depth + 1 &&
              folderState(member) !== 'unchecked'
            ) {
              return 'mixed';
            }
            member = member.nextElementSibling;
          }
          return 'unchecked';
        }

        // Unchecking a folder owns its subtree, like the desktop group
        // checkbox always did: every rendered member file row's pick
        // and every nested node selection's address leave with it.
        function dropNodeSubtree(row) {
          var rootId = row.dataset.nodeRoot;
          var sub = row.dataset.nodeSub;
          var prefix = sub === '' ? '' : sub + '/';
          var depth = Number(row.dataset.depth);
          var member = row.nextElementSibling;
          while (
            member &&
            member.dataset.depth !== undefined &&
            Number(member.dataset.depth) > depth
          ) {
            var box = member.querySelector('[data-select]');
            if (box) delete selected[box.dataset.select];
            member = member.nextElementSibling;
          }
          Object.keys(selectedNodes).forEach(function (address) {
            var colon = address.indexOf(':');
            if (address.slice(0, colon) !== rootId) return;
            var otherSub = address.slice(colon + 1);
            if (otherSub === sub || otherSub.indexOf(prefix) === 0) {
              delete selectedNodes[address];
            }
          });
        }

        function refresh() {
          // Every revealed control stays a button with a state
          // attribute — the script just stops hiding what a plain HTML
          // page has no use for: per-file checkboxes, the folder rows'
          // node checkboxes, and chevrons that only exist once a
          // fragment's rows arrive.
          Array.prototype.forEach.call(
            list.querySelectorAll('[data-toggle]'),
            function (chevron) {
              chevron.hidden = false;
            }
          );

          var fileIds = [];
          Array.prototype.forEach.call(
            list.querySelectorAll('[data-select]'),
            function (checkbox) {
              checkbox.hidden = false;
              setBox(selected[checkbox.dataset.select] === true, checkbox);
              fileIds.push(checkbox.dataset.select);
            }
          );

          // A collapsed subtree prunes its rows: file-id selections the
          // list can no longer see leave the selection, and select-all
          // covers exactly the rows that render — the desktop's rule.
          // Folder selections are node addresses, so they survive the
          // collapse until unchecked (issue #27).
          Object.keys(selected).forEach(function (id) {
            if (fileIds.indexOf(id) === -1) delete selected[id];
          });

          // The folder checkboxes state themselves from the selection,
          // never from the last click.
          Array.prototype.forEach.call(
            list.querySelectorAll('[data-node-select]'),
            function (checkbox) {
              checkbox.hidden = false;
              setBox(folderState(checkbox.closest('.folder-row')), checkbox);
            }
          );

          // Select-all covers exactly the rendered file rows plus every
          // root's node selection — the desktop's rule.
          var rootAddresses = Array.prototype.map.call(
            list.querySelectorAll('.folder-row[data-node-sub=""]'),
            nodeAddress
          );
          var ids = Object.keys(selected);
          var every =
            fileIds.length + rootAddresses.length > 0 &&
            fileIds.every(function (id) {
              return selected[id] === true;
            }) &&
            rootAddresses.every(function (address) {
              return selectedNodes[address] === true;
            });
          var some =
            (ids.length > 0 || Object.keys(selectedNodes).length > 0) && !every;
          setBox(every, selectAll);
          selectAll.setAttribute('aria-checked', some ? 'mixed' : every ? 'true' : 'false');

          // The download button hides when nothing is selected. One
          // file links directly; one node selection may link its
          // dedicated node route; anything else — file ids, node
          // addresses, or both — becomes one merged zip (issue #27).
          var addrs = Object.keys(selectedNodes);
          if (ids.length === 0 && addrs.length === 0) {
            downloadButton.classList.remove('is-visible');
            downloadButton.href = '/download/zip';
          } else if (ids.length === 1 && addrs.length === 0) {
            downloadButton.classList.add('is-visible');
            downloadButton.href = '/download/' + ids[0];
          } else if (addrs.length === 1 && ids.length === 0) {
            downloadButton.classList.add('is-visible');
            var colon = addrs[0].indexOf(':');
            downloadButton.href =
              '/download/zip/node/' +
              addrs[0].slice(0, colon) +
              '?sub=' +
              encodeURIComponent(addrs[0].slice(colon + 1));
          } else {
            downloadButton.classList.add('is-visible');
            var parts = [];
            if (ids.length > 0) parts.push('ids=' + ids.join(','));
            if (addrs.length > 0) {
              parts.push(
                'nodes=' +
                  addrs
                    .map(function (address) {
                      var colon = address.indexOf(':');
                      return (
                        address.slice(0, colon) +
                        ':' +
                        encodeURIComponent(address.slice(colon + 1))
                      );
                    })
                    .join(',')
              );
            }
            downloadButton.href = '/download/zip?' + parts.join('&');
          }
        }

        // -- expansion and per-node pages -----------------------------------

        function findFolderRow(key) {
          var match = null;
          Array.prototype.forEach.call(
            list.querySelectorAll('.folder-row[data-folder-key]'),
            function (row) {
              if (!match && row.dataset.folderKey === key) match = row;
            }
          );
          return match;
        }

        // A node's fragment address rides the row's own stamps: the
        // root record id plus the relative sub path — no absolute
        // filesystem path is ever addressed.
        function ensurePageState(row) {
          var key = row.dataset.folderKey;
          if (!pages[key]) {
            pages[key] = {
              rootId: row.dataset.nodeRoot,
              sub: row.dataset.nodeSub,
              offset: 0,
              hasMore: false,
              loading: false,
            };
          }
          return pages[key];
        }

        // One window of a node's page: the request itself materializes
        // the node's direct children server-side (ADR-0005 — the
        // listing showing the folder is the trigger), idempotent on
        // every repeat fetch.
        async function fetchWindow(key) {
          var state = pages[key];
          if (!state || state.loading) return false;
          state.loading = true;
          try {
            var url =
              '/node/' +
              encodeURIComponent(state.rootId) +
              '?sub=' +
              encodeURIComponent(state.sub) +
              '&offset=' +
              String(state.offset);
            var response = await fetch(url);
            if (!response.ok) return false;
            var text = await response.text();
            var holder = document.createElement('div');
            holder.innerHTML = text;
            var template = holder.querySelector('template');
            // The node may have been collapsed while its page was in
            // flight — its state is gone, so the answer is dropped.
            if (!template || !pages[key]) return false;
            applyFragment(key, template);
            return true;
          } catch (error) {
            // A dropped or failed page leaves the node untouched — its
            // rows simply stay unfetched. The console carries it for
            // anyone watching; the listing itself keeps working.
            console.warn('listing: node page fetch failed:', error);
            return false;
          } finally {
            var live = pages[key];
            if (live) live.loading = false;
          }
        }

        // Merge one fragment: the template's paging stamps advance the
        // node's fetch cursor (never backwards), then the rows slot
        // into place.
        function applyFragment(key, template) {
          var state = pages[key];
          var row = findFolderRow(key);
          if (!state || !row) return;

          var windowRows = Number(template.dataset.windowRows) || 0;
          var windowEnd = Number(template.dataset.offset) + windowRows;
          state.offset = Math.max(state.offset, windowEnd);
          state.hasMore = template.dataset.hasMore === 'true';
          insertRows(row, template.content);
          refresh();
        }

        // The fragment renders one derivation order — files, then
        // lazily-known folders, then this window's failure marker — but
        // the flat list reads in tree order. The node's own block (the
        // rows deeper than it that follow it) holds where earlier
        // windows and expanded child subtrees live, and the rows slot
        // around them: files before the node's first child folder,
        // folders before its first failure marker, the marker at the
        // very end of the block.
        function insertRows(row, content) {
          var depth = Number(row.dataset.depth);
          var children = [];
          var boundary = row.nextSibling;
          while (
            boundary &&
            boundary.nodeType === 1 &&
            boundary.dataset.depth !== undefined &&
            Number(boundary.dataset.depth) > depth
          ) {
            children.push(boundary);
            boundary = boundary.nextSibling;
          }

          var childFolder = null;
          var childMarker = null;
          children.forEach(function (child) {
            if (Number(child.dataset.depth) !== depth + 1) return;
            if (!childFolder && child.classList.contains('folder-row')) {
              childFolder = child;
            }
            if (!childMarker && child.classList.contains('materialize-marker')) {
              childMarker = child;
            }
          });

          var folderAnchor = childMarker || boundary;
          var fileAnchor = childFolder || folderAnchor;

          // Snapshot before inserting: `content.children` is live, and
          // every insertBefore moves its row out of the fragment —
          // iterating the collection directly would skip from the
          // second row on.
          Array.prototype.slice
            .call(content.children)
            .forEach(function (el) {
              if (el.classList.contains('file-row')) {
                list.insertBefore(el, fileAnchor);
              } else if (el.classList.contains('folder-row')) {
                list.insertBefore(el, folderAnchor);
              } else if (el.classList.contains('materialize-marker')) {
                list.insertBefore(el, boundary);
              }
            });
        }

        // Collapsing empties the node's page plus everything under it —
        // rows come out of the DOM and state leaves with them
        // (issue #24): a re-expand refetches from the first offset over
        // the server's idempotent registrations. The `/` boundary keeps
        // pruning whole-segment exact: `Photos` cannot prune `Photos-2`.
        function pruneUnder(row, key) {
          var depth = Number(row.dataset.depth);
          var el = row.nextSibling;
          while (
            el &&
            el.nodeType === 1 &&
            el.dataset.depth !== undefined &&
            Number(el.dataset.depth) > depth
          ) {
            var next = el.nextSibling;
            list.removeChild(el);
            el = next;
          }
          delete pages[key];
          var prefix = key + '/';
          Object.keys(pages).forEach(function (pageKey) {
            if (pageKey.indexOf(prefix) === 0) delete pages[pageKey];
          });
          Object.keys(expanded).forEach(function (expandedKey) {
            if (expandedKey.indexOf(prefix) === 0) delete expanded[expandedKey];
          });
          refresh();
        }

        function toggleFolder(row, chevron) {
          var key = row.dataset.folderKey;
          var open = !expanded[key];
          expanded[key] = open;

          // The row bakes the shade it shows (ADR-0002/0004): an open
          // folder paints the region's shade — grey at even depth,
          // plain at odd — and a collapsed row falls back to its
          // parent's. Nothing else re-shades: inserted rows carry the
          // stamps their server fragment derived.
          var depth = Number(row.dataset.depth);
          var shade;
          if (open) {
            shade = depth % 2 === 0 ? 1 : 0;
          } else if (depth === 0) {
            shade = 0;
          } else {
            shade = (depth - 1) % 2 === 0 ? 1 : 0;
          }
          row.dataset.shade = String(shade);

          chevron.setAttribute('aria-expanded', open ? 'true' : 'false');
          chevron.setAttribute(
            'aria-label',
            (open ? 'Collapse ' : 'Expand ') +
              row.querySelector('.folder-name').textContent
          );
          chevron.classList.toggle('is-collapsed', !open);

          if (open) {
            ensurePageState(row);
            void fetchWindow(key);
          } else {
            pruneUnder(row, key);
          }
        }

        // Fetch-ahead while scrolling (ADR-0006): near the end of the
        // container, every expanded node with a further page pulls its
        // next window, so the tail is seamless wherever it lands — the
        // hold stays bounded by one page budget per expanded node, and
        // collapsed nodes hold nothing.
        async function fetchAhead() {
          if (
            list.scrollTop + list.clientHeight <
            list.scrollHeight - FETCH_AHEAD_PX
          ) {
            return;
          }
          var keys = Object.keys(pages);
          for (var i = 0; i < keys.length; i += 1) {
            var state = pages[keys[i]];
            if (state.hasMore && !state.loading) await fetchWindow(keys[i]);
          }
        }

        // One delegated click handler covers every row the page ever
        // shows — fragments arrive after load. A checkbox selects its
        // row (a folder checkbox its node: checking never auto-checks
        // members, unchecking drops the subtree's member picks and
        // nested node selections — issue #27); only a folder row's own
        // chevron toggles the row (the row's click is never a toggle),
        // and a file's link downloads it with or without this script.
        list.addEventListener('click', function (event) {
          var target = event.target;
          if (!(target instanceof Element)) return;

          var nodeBox = target.closest('[data-node-select]');
          if (nodeBox && list.contains(nodeBox)) {
            var row = nodeBox.closest('.folder-row');
            if (row) {
              var address = nodeAddress(row);
              if (selectedNodes[address]) {
                dropNodeSubtree(row);
              } else {
                selectedNodes[address] = true;
              }
            }
            refresh();
            return;
          }

          var checkbox = target.closest('[data-select]');
          if (checkbox && list.contains(checkbox)) {
            var id = checkbox.dataset.select;
            if (selected[id]) {
              delete selected[id];
            } else {
              selected[id] = true;
            }
            refresh();
            return;
          }

          var chevron = target.closest('[data-toggle]');
          if (chevron && list.contains(chevron)) {
            var folderRow = chevron.closest('.folder-row');
            if (folderRow) toggleFolder(folderRow, chevron);
          }
        });

        selectAll.hidden = false;
        selectAll.addEventListener('click', function () {
          var boxes = Array.prototype.slice.call(
            list.querySelectorAll('[data-select]')
          );
          var ids = boxes.map(function (checkbox) {
            return checkbox.dataset.select;
          });
          // Roots are the folder rows stamped as whole records; their
          // node selections ride exactly like the desktop group's.
          var rootAddresses = Array.prototype.map.call(
            list.querySelectorAll('.folder-row[data-node-sub=""]'),
            nodeAddress
          );
          // "covered" after this click is when every rendered file row
          // and every root's node selection is selected now — covered
          // means the click empties the selection, partially covered
          // means the click finishes the job.
          var covered =
            ids.length + rootAddresses.length > 0 &&
            ids.every(function (id) {
              return selected[id] === true;
            }) &&
            rootAddresses.every(function (address) {
              return selectedNodes[address] === true;
            });
          ids.forEach(function (id) {
            if (covered) delete selected[id];
            else selected[id] = true;
          });
          rootAddresses.forEach(function (address) {
            if (covered) delete selectedNodes[address];
            else selectedNodes[address] = true;
          });
          if (covered) {
            // A covered selection means nothing else rode along to
            // keep: nested node selections leave with the sweep.
            Object.keys(selectedNodes).forEach(function (address) {
              delete selectedNodes[address];
            });
          }
          refresh();
        });

        // Expansion seeds from the server's stamps (`aria-expanded`):
        // neither side ever re-derives the five-children budget — the
        // stamps are the rule's derived form. Root rows' page states
        // start ready even while collapsed, so a toggle is one fetch.
        var expandedKeys = [];
        Array.prototype.forEach.call(
          list.querySelectorAll('.folder-row[data-folder-key]'),
          function (row) {
            var key = row.dataset.folderKey;
            var chevron = row.querySelector('[data-toggle]');
            if (chevron) {
              chevron.hidden = false;
              expanded[key] = chevron.getAttribute('aria-expanded') === 'true';
            }
            if (row.dataset.nodeRoot !== undefined) {
              ensurePageState(row);
              if (expanded[key]) expandedKeys.push(key);
            }
          }
        );

        // A stamped-expanded root's rows come from its own fragment —
        // the initial page carries top-level rows only, so the auto
        // fetch is what paints its first expansion.
        (async function () {
          for (var i = 0; i < expandedKeys.length; i += 1) {
            await fetchWindow(expandedKeys[i]);
          }
        })();

        list.addEventListener('scroll', function () {
          void fetchAhead();
        });

        refresh();
      })();
    </script>
  </body>
</html>
