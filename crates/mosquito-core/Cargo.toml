[package]
name = "mosquito-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "time",
] }
axum = "0.8.9"
qrcode = "0.14.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.20"
tokio-util = { "version" = "0.7.19", features = ["io"] }
local-ip-address = "0.6.13"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
